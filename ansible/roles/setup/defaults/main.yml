---
# Defaults for setup role

# Root path of the jarvis project on the target host — override in inventory
project_root: "{{ ansible_env.HOME }}/jarvis"

# Whether to install basic prerequisites (dialog, etc.)
install_prerequisites: true

# Whether to install Docker if missing
install_docker: false

# Whether to install Docker Compose if missing
install_compose: false

# Package state (present, latest)
package_state: present
