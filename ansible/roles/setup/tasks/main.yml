---
# Setup role - Verifies and installs prerequisites

# --- Generic Prerequisites ---
- name: Install required system packages (dialog)
  package:
    name: dialog
    state: "{{ package_state }}"
  become: yes
  when: install_prerequisites | bool

# --- Docker Installation (Debian/Ubuntu) ---
- block:
    - name: Install required packages for Docker setup
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: yes

    - name: Create directory for keyrings
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Docker's official GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
        force: no

    - name: Determine Docker repository architecture
      set_fact:
        docker_repo_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64', 'armv7l': 'armhf'}[ansible_architecture] | default(ansible_architecture) }}"

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch={{ docker_repo_arch }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker packages
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: "{{ package_state }}"
        update_cache: yes
      notify: restart docker
  become: yes
  when: 
    - install_docker | bool
    - ansible_os_family == "Debian"

# --- Docker Installation (RedHat/Fedora) ---
- block:
    - name: Install specific packages for Fedora
      dnf:
        name: dnf-plugins-core
        state: present
      when: ansible_distribution == "Fedora"

    - name: Install specific packages for RHEL/CentOS
      yum:
        name: yum-utils
        state: present
      when: ansible_distribution != "Fedora"

    - name: Add Docker repository (Fedora/RHEL)
      get_url:
        url: https://download.docker.com/linux/{{ (ansible_distribution == 'Fedora') | ternary('fedora','centos') }}/docker-ce.repo
        dest: /etc/yum.repos.d/docker-ce.repo

    - name: Install Docker packages (RedHat/Fedora)
      dnf:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: "{{ package_state }}"
      notify: restart docker
  become: yes
  when: 
    - install_docker | bool
    - ansible_os_family == "RedHat"

# --- Docker Installation (Arch Linux) ---
- block:
    - name: Install Docker and Compose (Arch)
      pacman:
        name:
          - docker
          - docker-compose
        state: "{{ package_state }}"
        update_cache: yes
      notify: restart docker
  become: yes
  when: 
    - install_docker | bool
    - ansible_os_family == "Archlinux"

# --- Docker Post-Installation ---
- name: Ensure Docker service is running and enabled
  service:
    name: docker
    state: started
    enabled: yes
  become: yes
  when: install_docker | bool

- name: Check if Docker is installed (Verification)
  command: docker --version
  register: docker_check
  changed_when: false
  failed_when: false

- name: Warn if Docker is not installed
  debug:
    msg: "WARNING: Docker is not installed. Use '-e install_docker=true' to install it."
  when: docker_check.rc != 0

- name: Ensure user is in docker group
  user:
    name: "{{ ansible_user_id }}"
    groups: docker
    append: yes
  become: yes
  when: 
    - docker_check.rc == 0
    - install_docker | bool

- name: Check user docker group membership (Verification)
  shell: "groups {{ ansible_user_id }}"
  register: user_groups
  changed_when: false

- name: Verify docker group membership
  assert:
    that: "'docker' in user_groups.stdout"
    fail_msg: "User is not in 'docker' group. Setup might have just added it; a re-login is required."
    success_msg: "User has docker group membership"
  ignore_errors: true
  when: docker_check.rc == 0

# --- Docker Compose Verification ---
- name: Check if Docker Compose is available
  command: docker compose version
  register: compose_check
  changed_when: false
  failed_when: false

- name: Install standalone Docker Compose (Optional Fallback)
  get_url:
    url: "https://github.com/docker/compose/releases/latest/download/docker-compose-{{ ansible_system | lower }}-{{ ansible_machine }}"
    dest: /usr/local/bin/docker-compose
    mode: '0755'
  become: yes
  when: 
    - install_compose | bool
    - compose_check.rc != 0
    - ansible_os_family != "Archlinux" # Arch installs it via package above

- name: Warn if Docker Compose is not available
  debug:
    msg: "WARNING: Docker Compose is not available. Use '-e install_compose=true' to install standalone binary (non-Arch)."
  when: 
    - compose_check.rc != 0 
    - not install_compose | bool

# --- Project Directory Setup ---
- name: Check for required directories
  stat:
    path: "{{ item }}"
  register: dir_stats
  loop:
    - "{{ production_dir | default(project_root + '/production') }}"
    - "{{ beta_dir | default(project_root + '/beta') }}"

- name: Verify directories exist
  assert:
    that:
      - item.stat.exists
      - item.stat.isdir
    fail_msg: "Required directory {{ item.item }} is missing or is not a directory."
    success_msg: "Required directory {{ item.item }} exists."
  loop: "{{ dir_stats.results }}"

- name: Setup complete message
  debug:
    msg: "✅ Verification complete. Dialog installed. Docker: {{ 'Installed' if docker_check.rc == 0 else 'Missing' }}."
