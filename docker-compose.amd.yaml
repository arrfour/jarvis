# AMD GPU Override — uses ollama/ollama:rocm image with ROCm device passthrough
# Applied automatically by manage.sh when /dev/kfd is detected.
# Privileged mode is required for rootless Podman GPU access.

services:
  ollama:
    image: ollama/ollama:rocm
    privileged: true
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    environment:
      # RDNA 4 (gfx1200) needs this override for proper GPU detection
      HSA_OVERRIDE_GFX_VERSION: "${HSA_OVERRIDE_GFX_VERSION:-12.0.0}"
