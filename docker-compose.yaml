# Root Docker Compose - Manages both Production and Beta stacks
#
# Usage:
#   docker compose up -d                      # Start both stacks
#   docker compose up -d --profile prod       # Start only production
#   docker compose up -d --profile beta       # Start only beta
#   docker compose down                       # Stop both stacks
#   docker compose ps                         # View all containers

services:
  # ============================================
  # PRODUCTION STACK
  # ============================================
  # Production - PINNED to stable version for reliability
  open-webui2:
    image: ghcr.io/open-webui/open-webui:v0.8.12-ollama
    container_name: open-webui2
    ports:
      - "11434:11434"

    profiles:
      - prod
      - all
    environment:
      BACKEND_URL: http://localhost:8080/api
      OLLAMA_BASE_URL: http://localhost:11434
    volumes:
      - ollama:/root/.ollama
      - open-webui:/app/backend/data
    restart: always
    networks:
      - internal-prod
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s

  tailscale-sidecar:
    image: tailscale/tailscale:unstable
    container_name: tailscale-sidecar
    hostname: jarvis
    privileged: true
    profiles:
      - prod
      - all
    environment:
      TS_HOSTNAME: jarvis
      TS_ACCEPT_DNS: true
      TS_EXTRA_ARGS: "--advertise-tags=tag:server,tag:services"
      # VIP registration — override if defaults don't match your setup
      APP_HEALTH_URL: ${APP_HEALTH_URL:-http://nginx-prod:80/health}
      VIP_SERVICE: ${VIP_SERVICE:-svc:jarvis}
      VIP_BACKEND: ${VIP_BACKEND:-http://nginx-prod:80}
    volumes:
      - tailscale-sidecar-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
      - ./production/tailscale-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: always
    networks:
      - internal-prod
    env_file:
      - production/.env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx-prod:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: always
    profiles:
      - prod
      - all
    volumes:
      - ./production/nginx.conf:/etc/nginx/nginx.conf:ro,z
    depends_on:
      - open-webui2
    networks:
      - internal-prod
    ports:
      - "0.0.0.0:8080:80"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  # ============================================
  # BETA STACK
  # ============================================
  # Beta - ROLLING tag to always get latest features for testing
  open-webui-beta:
    image: ghcr.io/open-webui/open-webui:v0.8.12-ollama
    container_name: open-webui-beta
    ports:
      - "11435:11434"

    profiles:
      - beta
      - all
    environment:
      BACKEND_URL: http://localhost:8081/api
      OLLAMA_BASE_URL: http://localhost:11434
    volumes:
      - ollama-beta:/root/.ollama
      - open-webui-beta:/app/backend/data
      - ./beta/assets/favicon-beta.svg:/app/backend/static/favicon.png:ro,z
      - ./beta/assets/logo-beta.svg:/app/backend/static/logo.svg:ro,z
    restart: always
    networks:
      - internal-beta
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  tailscale-sidecar-beta:
    image: tailscale/tailscale:unstable
    container_name: tailscale-sidecar-beta
    hostname: jarvis-beta
    privileged: true
    profiles:
      - beta
      - all
    environment:
      TS_HOSTNAME: jarvis-beta
      TS_ACCEPT_DNS: true
      TS_EXTRA_ARGS: "--advertise-tags=tag:server,tag:services"
      # VIP registration — takeover the production service
      APP_HEALTH_URL: ${APP_HEALTH_URL_BETA:-http://nginx-beta:80/health}
      VIP_SERVICE: ${VIP_SERVICE:-svc:jarvis}
      VIP_BACKEND: ${VIP_BACKEND:-http://nginx-beta:80}
    volumes:
      - tailscale-sidecar-beta-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
      - ./production/tailscale-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: always
    networks:
      - internal-beta
    env_file:
      - beta/.env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx-beta:
    image: nginx:alpine
    container_name: nginx-beta
    restart: always
    profiles:
      - beta
      - all
    volumes:
      - ./beta/nginx.conf:/etc/nginx/nginx.conf:ro,z
    depends_on:
      - open-webui-beta
    networks:
      - internal-beta
    ports:
      - "0.0.0.0:8081:80"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal-prod:
    driver: bridge
  internal-beta:
    driver: bridge

volumes:
  # Production volumes
  ollama:
    driver: local
  open-webui:
    driver: local
  tailscale-sidecar-state:
    driver: local

  # Beta volumes
  ollama-beta:
    driver: local
  open-webui-beta:
    driver: local
  tailscale-sidecar-beta-state:
    driver: local
