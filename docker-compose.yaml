# Jarvis Stack — Ollama (GPU inference) + Open WebUI + Nginx + Tailscale
#
# Usage:
#   docker compose up -d          # Start stack (auto GPU via manage.sh)
#   docker compose down           # Stop stack
#   docker compose ps             # View containers
#   ./manage.sh start             # Recommended: auto-detects GPU + handles Tailscale

services:
  # ── Ollama: GPU inference engine ─────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama:/root/.ollama
    restart: always
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:11434/api/version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Open WebUI: chat interface, backed by Ollama ─────────────────────────────
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.8.12
    container_name: open-webui
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      ollama:
        condition: service_healthy
    restart: always
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Nginx: reverse proxy (Tailscale Serve terminates HTTPS) ──────────────────
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro,z
    depends_on:
      open-webui:
        condition: service_healthy
    networks:
      - internal
    ports:
      - "0.0.0.0:8080:80"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Tailscale: Tailnet exposure for UI (VIP) and Ollama API ──────────────────
  tailscale:
    image: tailscale/tailscale:unstable
    container_name: tailscale
    hostname: jarvis
    privileged: true
    environment:
      TS_HOSTNAME: jarvis
      TS_ACCEPT_DNS: "true"
      APP_HEALTH_URL: ${APP_HEALTH_URL:-http://nginx:80/health}
      VIP_SERVICE: ${VIP_SERVICE:-svc:jarvis}
      VIP_BACKEND: ${VIP_BACKEND:-http://nginx:80}
      VIP_MODE: ${VIP_MODE:-http}
      OLLAMA_SERVE_URL: ${OLLAMA_SERVE_URL:-http://ollama:11434}
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
      - ./tailscale-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: always
    networks:
      - internal
    env_file:
      - .env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal:
    driver: bridge

volumes:
  ollama:
    driver: local
  open-webui:
    driver: local
  tailscale-state:
    driver: local
